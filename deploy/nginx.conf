server {
    listen 80;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Development HTTP only. Production TLS and Secure cookies are not supplied here.
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        # No URI suffix: preserve /api/v1/... and use the same browser origin.
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Preserve the backend's no-store response header (including health responses).
    }

    # Uploads are never mounted in this container, aliased or served as static files.
    location ~ ^/(uploads|attachments|private)(/|$) {
        return 404;
    }
    location ~ /\. {
        return 404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
